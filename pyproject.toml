[tool.pylint.main]
py-version = "3.11"
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "exec-used",
    "too-many-branches",
    "too-few-public-methods",
    "unspecified-encoding",
    "consider-using-f-string",
    "too-many-instance-attributes",
    "broad-exception-raised",
]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ansible-specdoc"
authors = [{ name = "Linode", email = "dev-dx@linode.com" }]
description = "A simple tool for generating Ansible collection documentation from module spec."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["ansible"]
dependencies = [
    "PyYAML>=6.0.3",
    "Jinja2>=3.1.6",
    "redbaron>=0.9.2",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pylint>=4.0.7",
    "build>=1.6.1",
    "black>=26.5.1",
    "isort>=9.0.2",
    "autoflake>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/linode/ansible-specdoc/"

[project.scripts]
ansible-specdoc = "ansible_specdoc.cli:main"

[tool.setuptools]
packages = ["ansible_specdoc"]

[tool.setuptools.dynamic]
version = { attr = "ansible_specdoc.version.__version__" }

[tool.isort]
profile = "black"
line_length = 80

[tool.black]
line-length = 80
target-version = ["py311", "py312", "py313"]

[tool.autoflake]
expand-star-imports = false
ignore-init-module-imports = true
ignore-pass-after-docstring = true
in-place = true
recursive = true
remove-all-unused-imports = false
remove-duplicate-keys = false
